apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-hybrid
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM node:20-alpine

    WORKDIR /app

    # Create package.json
    RUN echo '{\
      "name": "@codequal/hybrid-agent-service",\
      "version": "1.0.0",\
      "description": "Hybrid agent service with caching",\
      "main": "src/index.js",\
      "scripts": {\
        "start": "node src/index.js"\
      }\
    }' > package.json

    # Install dependencies
    RUN npm install --save \
        openai@4.38.5 \
        ioredis@5.3.2 \
        winston@3.11.0 \
        express@4.18.2

    # Create source directory
    RUN mkdir -p src

    # Create hybrid service
    RUN cat > src/index.js << 'EOF'
    const express = require('express');
    const Redis = require('ioredis');
    const OpenAI = require('openai');
    const crypto = require('crypto');

    const app = express();
    app.use(express.json());

    // Initialize services
    const redis = new Redis(process.env.REDIS_URL || 'redis://localhost:6379');
    const openai = new OpenAI({
      apiKey: process.env.OPENROUTER_API_KEY,
      baseURL: "https://openrouter.ai/api/v1"
    });

    const hitRate = { hits: 0, misses: 0 };

    function generateCacheKey(issue) {
      const parts = [
        issue.tool || 'unknown',
        issue.type || 'unknown',
        issue.category || 'general',
        issue.language || 'any'
      ];
      return `fix:${parts.join(':')}:${crypto.createHash('md5').update(JSON.stringify(issue)).digest('hex')}`;
    }

    function getHitRate() {
      const total = hitRate.hits + hitRate.misses;
      if (total === 0) return 0;
      return Math.round((hitRate.hits / total) * 100);
    }

    async function generateFix(issue) {
      const agentType = selectAgent(issue);
      const prompt = `Fix this ${issue.type} issue in ${issue.language}:
    Tool: ${issue.tool}
    Category: ${issue.category}
    Message: ${issue.message}
    File: ${issue.file}
    Line: ${issue.line}

    Generate a concise, actionable fix.`;

      try {
        const response = await openai.chat.completions.create({
          model: issue.complexity === 'low' ? 'openai/gpt-3.5-turbo' : 'anthropic/claude-3-haiku-20240307',
          messages: [
            { role: "system", content: getSystemPrompt(agentType) },
            { role: "user", content: prompt }
          ],
          temperature: 0.3,
          max_tokens: 500
        });

        return {
          fix: response.choices[0].message.content,
          confidence: calculateConfidence(issue),
          explanation: `Fix generated by ${agentType} agent`,
          timestamp: new Date().toISOString()
        };
      } catch (error) {
        console.error(`Agent ${agentType} error:`, error);
        throw error;
      }
    }

    function getSystemPrompt(agentType) {
      const prompts = {
        security: "You are a security expert. Provide secure code fixes.",
        performance: "You are a performance optimization expert. Provide efficient fixes.",
        quality: "You are a code quality expert. Provide clean, maintainable fixes.",
        architecture: "You are a software architect. Provide design pattern fixes.",
        dependency: "You are a dependency management expert. Provide version and compatibility fixes."
      };
      return prompts[agentType] || prompts.quality;
    }

    function selectAgent(issue) {
      if (issue.type === 'security' || issue.category?.includes('security')) return 'security';
      if (issue.type === 'performance' || issue.category?.includes('performance')) return 'performance';
      if (issue.type === 'architecture' || issue.category?.includes('design')) return 'architecture';
      if (issue.type === 'dependency' || issue.tool === 'npm-audit') return 'dependency';
      return 'quality';
    }

    function calculateConfidence(issue) {
      if (issue.tool === 'spotbugs' && issue.category === 'BAD_PRACTICE') return 'high';
      if (issue.tool === 'eslint' && issue.category === 'style') return 'high';
      if (issue.tool === 'pylint' && issue.category === 'convention') return 'high';
      return 'medium';
    }

    // Health endpoint
    app.get('/health', async (req, res) => {
      try {
        await redis.ping();
        res.json({
          status: 'healthy',
          service: 'hybrid-agent',
          redis: 'connected',
          agents: ['security', 'performance', 'quality', 'architecture', 'dependency'],
          cacheHitRate: getHitRate() + '%'
        });
      } catch (error) {
        res.status(500).json({ status: 'unhealthy', error: error.message });
      }
    });

    // Fix endpoint
    app.post('/fix', async (req, res) => {
      const { issue } = req.body;
      if (!issue) {
        return res.status(400).json({ error: 'Issue data required' });
      }

      try {
        const cacheKey = generateCacheKey(issue);

        // Check cache
        const cached = await redis.get(cacheKey);
        if (cached) {
          hitRate.hits++;
          console.log(`Cache HIT for ${issue.tool}:${issue.category} (${getHitRate()}% hit rate)`);
          return res.json({
            success: true,
            fix: JSON.parse(cached),
            cached: true,
            cacheHitRate: getHitRate() + '%'
          });
        }

        // Generate new fix
        hitRate.misses++;
        console.log(`Cache MISS for ${issue.tool}:${issue.category} (${getHitRate()}% hit rate)`);

        const fix = await generateFix(issue);

        // Cache it
        const ttl = issue.confidence === 'high' ? 604800 : (issue.confidence === 'medium' ? 86400 : 3600);
        await redis.setex(cacheKey, ttl, JSON.stringify(fix));

        res.json({
          success: true,
          fix,
          cached: false,
          cacheHitRate: getHitRate() + '%'
        });
      } catch (error) {
        console.error('Fix generation error:', error);
        res.status(500).json({ success: false, error: error.message });
      }
    });

    // Batch endpoint
    app.post('/fix/batch', async (req, res) => {
      const { issues } = req.body;
      if (!issues || !Array.isArray(issues)) {
        return res.status(400).json({ error: 'Array of issues required' });
      }

      const results = [];
      let cached = 0, generated = 0;

      for (const issue of issues) {
        try {
          const cacheKey = generateCacheKey(issue);
          let fix = await redis.get(cacheKey);

          if (fix) {
            hitRate.hits++;
            fix = JSON.parse(fix);
            fix.cached = true;
            cached++;
          } else {
            hitRate.misses++;
            fix = await generateFix(issue);
            const ttl = calculateConfidence(issue) === 'high' ? 604800 : 86400;
            await redis.setex(cacheKey, ttl, JSON.stringify(fix));
            generated++;
          }

          results.push({ issue, fix, success: true });
        } catch (error) {
          results.push({ issue, error: error.message, success: false });
        }
      }

      res.json({
        success: true,
        results,
        stats: {
          total: issues.length,
          cached,
          generated,
          failed: results.filter(r => !r.success).length,
          cacheHitRate: getHitRate() + '%'
        }
      });
    });

    // Stats endpoint
    app.get('/stats', (req, res) => {
      res.json({
        cacheHitRate: getHitRate() + '%',
        hits: hitRate.hits,
        misses: hitRate.misses,
        total: hitRate.hits + hitRate.misses
      });
    });

    const PORT = process.env.PORT || 3000;
    app.listen(PORT, () => {
      console.log(`Hybrid Agent Service running on port ${PORT}`);
      console.log('Available agents: security, performance, quality, architecture, dependency');
      console.log('Redis URL:', process.env.REDIS_URL || 'redis://localhost:6379');
    });
    EOF

    ENV NODE_ENV=production \
        PORT=3000 \
        REDIS_URL=redis://localhost:6379

    EXPOSE 3000

    CMD ["node", "src/index.js"]

---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-hybrid
  namespace: codequal-dev
spec:
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=/workspace/Dockerfile"
        - "--context=/workspace"
        - "--destination=registry.digitalocean.com/codequal-registry/hybrid-agent:kaniko-latest"
        - "--destination=registry.digitalocean.com/codequal-registry/hybrid-agent:kaniko-v1"
        - "--cache=true"
        - "--cache-ttl=24h"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: docker-config
          mountPath: /kaniko/.docker
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      restartPolicy: Never
      volumes:
      - name: dockerfile
        configMap:
          name: dockerfile-hybrid
      - name: docker-config
        secret:
          secretName: registry-codequal-registry
          items:
          - key: .dockerconfigjson
            path: config.json
  backoffLimit: 3