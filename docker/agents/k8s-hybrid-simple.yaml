apiVersion: v1
kind: ConfigMap
metadata:
  name: hybrid-agent-code
  namespace: codequal-dev
data:
  index.js: |
    const express = require('express');
    const app = express();
    app.use(express.json());

    // Simple health check
    app.get('/health', (req, res) => {
      res.json({
        status: 'healthy',
        service: 'hybrid-agent-k8s',
        environment: 'production',
        redis: process.env.REDIS_URL ? 'configured' : 'not configured'
      });
    });

    // Placeholder fix endpoint
    app.post('/fix', (req, res) => {
      res.json({
        success: true,
        message: 'Hybrid agent deployed to Kubernetes',
        environment: 'DigitalOcean',
        note: 'Full implementation ready for deployment'
      });
    });

    const PORT = process.env.PORT || 3000;
    app.listen(PORT, () => {
      console.log(`Hybrid Agent running on Kubernetes - Port ${PORT}`);
    });

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-agent-simple
  namespace: codequal-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hybrid-agent-simple
  template:
    metadata:
      labels:
        app: hybrid-agent-simple
    spec:
      containers:
      - name: agent
        image: node:20-alpine
        command: ["sh", "-c"]
        args:
        - |
          cd /app
          npm init -y
          npm install express ioredis
          cp /config/index.js .
          node index.js
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: REDIS_URL
          value: "redis://redis-cache:6379"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: OPENROUTER_API_KEY
        volumeMounts:
        - name: code
          mountPath: /config
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
      volumes:
      - name: code
        configMap:
          name: hybrid-agent-code

---
apiVersion: v1
kind: Service
metadata:
  name: hybrid-agent-simple-service
  namespace: codequal-dev
spec:
  selector:
    app: hybrid-agent-simple
  ports:
  - port: 80
    targetPort: 3000
  type: LoadBalancer