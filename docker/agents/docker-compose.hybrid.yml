version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: codequal-redis-hybrid
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - codequal-hybrid

  hybrid-agent:
    image: codequal/hybrid-agent:latest
    container_name: codequal-hybrid-agent
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-test-key}
      - LOG_LEVEL=info
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - codequal-hybrid

networks:
  codequal-hybrid:
    driver: bridge

volumes:
  redis-data:
    driver: local