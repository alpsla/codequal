apiVersion: v1
kind: ConfigMap
metadata:
  name: hybrid-agent-full
  namespace: codequal-dev
data:
  server.js: |
    const express = require('express');
    const Redis = require('ioredis');
    const OpenAI = require('openai');
    const crypto = require('crypto');
    const axios = require('axios');

    const app = express();
    app.use(express.json({ limit: '50mb' }));

    // Initialize services
    const redis = new Redis(process.env.REDIS_URL || 'redis://redis-cache:6379');
    const openai = new OpenAI({
      apiKey: process.env.OPENROUTER_API_KEY,
      baseURL: "https://openrouter.ai/api/v1"
    });

    // Cache statistics
    const stats = {
      hits: 0,
      misses: 0,
      apiCalls: 0,
      errors: 0,
      startTime: Date.now()
    };

    // Generate cache key for issues
    function generateCacheKey(issue) {
      const parts = [
        'fix',
        issue.tool || 'unknown',
        issue.type || 'unknown',
        issue.category || 'general',
        issue.language || 'any',
        issue.rule || 'default'
      ];
      const hash = crypto.createHash('md5').update(JSON.stringify(issue)).digest('hex').substring(0, 8);
      return parts.join(':') + ':' + hash;
    }

    // Select appropriate agent
    function selectAgent(issue) {
      if (issue.type === 'security' || issue.category?.toLowerCase().includes('security')) return 'security';
      if (issue.type === 'performance' || issue.category?.toLowerCase().includes('performance')) return 'performance';
      if (issue.type === 'architecture' || issue.category?.toLowerCase().includes('design')) return 'architecture';
      if (issue.type === 'dependency' || issue.tool === 'npm-audit') return 'dependency';
      return 'quality';
    }

    // Calculate confidence
    function calculateConfidence(issue) {
      // High confidence patterns
      if (issue.tool === 'spotbugs' && issue.category === 'BAD_PRACTICE') return 'high';
      if (issue.tool === 'eslint' && issue.category === 'style') return 'high';
      if (issue.tool === 'pylint' && issue.category === 'convention') return 'high';
      if (issue.tool === 'checkstyle' && issue.type === 'style') return 'high';

      // Medium confidence
      if (issue.type === 'quality') return 'medium';
      if (issue.type === 'security') return 'medium';

      return 'low';
    }

    // Get TTL based on confidence
    function getTTL(confidence) {
      switch(confidence) {
        case 'high': return 604800; // 7 days
        case 'medium': return 86400; // 1 day
        default: return 3600; // 1 hour
      }
    }

    // Generate fix using OpenRouter
    async function generateFix(issue) {
      const agent = selectAgent(issue);

      const prompt = `Fix this ${issue.type} issue in ${issue.language || 'code'}:
    Tool: ${issue.tool}
    Category: ${issue.category}
    Rule: ${issue.rule || 'N/A'}
    Message: ${issue.message}
    File: ${issue.file}
    Line: ${issue.line}
    ${issue.code ? 'Code context:\n' + issue.code : ''}

    Provide a clear, concise fix with explanation.`;

      const systemPrompts = {
        security: "You are a security expert. Provide secure fixes that prevent vulnerabilities.",
        performance: "You are a performance expert. Provide optimized solutions.",
        quality: "You are a code quality expert. Provide clean, maintainable fixes.",
        architecture: "You are a software architect. Provide design improvements.",
        dependency: "You are a dependency expert. Provide version and compatibility fixes."
      };

      try {
        stats.apiCalls++;
        const response = await openai.chat.completions.create({
          model: issue.complexity === 'high' ? 'anthropic/claude-3-haiku-20240307' : 'openai/gpt-3.5-turbo',
          messages: [
            { role: "system", content: systemPrompts[agent] },
            { role: "user", content: prompt }
          ],
          temperature: 0.3,
          max_tokens: 500
        });

        return {
          fix: response.choices[0].message.content,
          agent: agent,
          confidence: calculateConfidence(issue),
          model: response.model,
          timestamp: new Date().toISOString()
        };
      } catch (error) {
        stats.errors++;
        console.error(`Fix generation error: ${error.message}`);
        // Fallback to pattern-based fix
        return {
          fix: getFallbackFix(issue),
          agent: agent,
          confidence: 'low',
          fallback: true,
          timestamp: new Date().toISOString()
        };
      }
    }

    // Fallback pattern-based fixes
    function getFallbackFix(issue) {
      const patterns = {
        'NP_NULL_ON_SOME_PATH_FROM_RETURN_VALUE': 'Add null check before using the returned value',
        'DLS_DEAD_LOCAL_STORE': 'Remove the unused variable assignment',
        'Missing semicolon': 'Add semicolon at the end of the line',
        'Line too long': 'Break the line to comply with line length limits',
        'SQL_INJECTION': 'Use parameterized queries instead of string concatenation'
      };

      return patterns[issue.message] || patterns[issue.rule] ||
             `Apply standard fix for ${issue.type} issue: ${issue.message}`;
    }

    // Health endpoint
    app.get('/health', async (req, res) => {
      try {
        await redis.ping();
        const uptime = Math.floor((Date.now() - stats.startTime) / 1000);
        const hitRate = stats.hits + stats.misses > 0
          ? Math.round((stats.hits / (stats.hits + stats.misses)) * 100)
          : 0;

        res.json({
          status: 'healthy',
          service: 'hybrid-agent-full',
          environment: 'kubernetes',
          redis: 'connected',
          stats: {
            cacheHitRate: hitRate + '%',
            totalRequests: stats.hits + stats.misses,
            apiCalls: stats.apiCalls,
            errors: stats.errors,
            uptime: uptime + 's'
          }
        });
      } catch (error) {
        res.status(500).json({
          status: 'unhealthy',
          error: error.message
        });
      }
    });

    // Single fix endpoint
    app.post('/fix', async (req, res) => {
      const { issue } = req.body;

      if (!issue) {
        return res.status(400).json({ error: 'Issue data required' });
      }

      try {
        const cacheKey = generateCacheKey(issue);

        // Check cache
        const cached = await redis.get(cacheKey);
        if (cached) {
          stats.hits++;
          const fix = JSON.parse(cached);
          fix.cached = true;
          console.log(`Cache HIT: ${cacheKey}`);
          return res.json({ success: true, fix, cached: true });
        }

        // Generate new fix
        stats.misses++;
        console.log(`Cache MISS: ${cacheKey}`);

        const fix = await generateFix(issue);

        // Store in cache
        const ttl = getTTL(fix.confidence);
        await redis.setex(cacheKey, ttl, JSON.stringify(fix));

        res.json({ success: true, fix, cached: false });
      } catch (error) {
        stats.errors++;
        console.error('Fix error:', error);
        res.status(500).json({
          success: false,
          error: error.message
        });
      }
    });

    // Batch fix endpoint for PR analysis
    app.post('/fix/batch', async (req, res) => {
      const { issues, prInfo } = req.body;

      if (!issues || !Array.isArray(issues)) {
        return res.status(400).json({ error: 'Array of issues required' });
      }

      console.log(`Processing batch of ${issues.length} issues for PR: ${prInfo?.url || 'unknown'}`);

      const results = [];
      let cached = 0, generated = 0, failed = 0;

      for (const issue of issues) {
        try {
          const cacheKey = generateCacheKey(issue);
          let fix = await redis.get(cacheKey);

          if (fix) {
            stats.hits++;
            cached++;
            fix = JSON.parse(fix);
            fix.cached = true;
          } else {
            stats.misses++;
            generated++;
            fix = await generateFix(issue);
            const ttl = getTTL(fix.confidence);
            await redis.setex(cacheKey, ttl, JSON.stringify(fix));
          }

          results.push({
            issue,
            fix,
            success: true
          });
        } catch (error) {
          failed++;
          stats.errors++;
          results.push({
            issue,
            error: error.message,
            success: false
          });
        }
      }

      const hitRate = stats.hits + stats.misses > 0
        ? Math.round((stats.hits / (stats.hits + stats.misses)) * 100)
        : 0;

      res.json({
        success: true,
        results,
        stats: {
          total: issues.length,
          cached,
          generated,
          failed,
          cacheHitRate: hitRate + '%',
          processingTime: Date.now() - req.startTime + 'ms'
        },
        prInfo
      });
    });

    // Analyze PR endpoint (integrates with tools)
    app.post('/analyze-pr', async (req, res) => {
      const { repository, prNumber, tools } = req.body;

      console.log(`Analyzing PR: ${repository}#${prNumber}`);

      // This would normally call the tool services
      // For now, return a structured response
      res.json({
        success: true,
        message: 'PR analysis initiated',
        repository,
        prNumber,
        analysisId: crypto.randomBytes(16).toString('hex'),
        status: 'processing',
        estimatedTime: '30s'
      });
    });

    // Stats endpoint
    app.get('/stats', (req, res) => {
      const hitRate = stats.hits + stats.misses > 0
        ? Math.round((stats.hits / (stats.hits + stats.misses)) * 100)
        : 0;

      res.json({
        cacheHitRate: hitRate + '%',
        hits: stats.hits,
        misses: stats.misses,
        total: stats.hits + stats.misses,
        apiCalls: stats.apiCalls,
        errors: stats.errors,
        uptime: Math.floor((Date.now() - stats.startTime) / 1000) + 's'
      });
    });

    // Clear cache endpoint (admin only)
    app.delete('/cache', async (req, res) => {
      const { pattern = 'fix:*' } = req.query;

      try {
        const keys = await redis.keys(pattern);
        if (keys.length > 0) {
          await redis.del(...keys);
        }

        res.json({
          success: true,
          cleared: keys.length,
          message: `Cleared ${keys.length} cache entries`
        });
      } catch (error) {
        res.status(500).json({
          success: false,
          error: error.message
        });
      }
    });

    // Middleware for request timing
    app.use((req, res, next) => {
      req.startTime = Date.now();
      next();
    });

    const PORT = process.env.PORT || 3000;
    app.listen(PORT, () => {
      console.log(`Hybrid Agent Full Service running on port ${PORT}`);
      console.log('Environment:', process.env.NODE_ENV);
      console.log('Redis URL:', process.env.REDIS_URL);
      console.log('Ready to process fixes with caching');
    });

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-agent-full
  namespace: codequal-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hybrid-agent-full
  template:
    metadata:
      labels:
        app: hybrid-agent-full
    spec:
      containers:
      - name: agent
        image: node:20-alpine
        workingDir: /home/node
        command: ["sh", "-c"]
        args:
        - |
          npm init -y
          npm install express ioredis openai axios crypto
          cp /config/server.js .
          node server.js
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: REDIS_URL
          value: "redis://redis-cache:6379"
        - name: OPENROUTER_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: OPENROUTER_API_KEY
        volumeMounts:
        - name: code
          mountPath: /config
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: code
        configMap:
          name: hybrid-agent-full

---
apiVersion: v1
kind: Service
metadata:
  name: hybrid-agent-full-service
  namespace: codequal-dev
spec:
  selector:
    app: hybrid-agent-full
  ports:
  - name: http
    port: 80
    targetPort: 3000
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hybrid-agent-full-hpa
  namespace: codequal-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hybrid-agent-full
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80