apiVersion: v1
kind: ConfigMap
metadata:
  name: emergency-dockerfiles
  namespace: codequal-dev
data:
  Dockerfile.python: |
    FROM python:3.11-slim
    
    # Install Python security and quality tools
    RUN pip install --no-cache-dir \
        bandit \
        safety \
        pylint \
        flake8 \
        black \
        mypy \
        pytest \
        coverage \
        && pip cache purge
    
    WORKDIR /workspace
    CMD ["/bin/bash"]
    
  Dockerfile.go: |
    FROM golang:1.21-alpine
    
    # Install Go analysis tools
    RUN apk add --no-cache git gcc musl-dev && \
        go install honnef.co/go/tools/cmd/staticcheck@latest && \
        go install golang.org/x/tools/cmd/goimports@latest && \
        go install github.com/securego/gosec/v2/cmd/gosec@latest
    
    WORKDIR /workspace
    CMD ["/bin/sh"]

---
apiVersion: batch/v1
kind: Job
metadata:
  name: emergency-rebuild-python
  namespace: codequal-dev
spec:
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
          - "--dockerfile=/workspace/Dockerfile.python"
          - "--context=dir:///workspace"
          - "--destination=registry.digitalocean.com/codequal/analyzer:lang-python-v3"
          - "--cache=false"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: docker-config
          mountPath: /kaniko/.docker
      restartPolicy: Never
      volumes:
      - name: dockerfile
        configMap:
          name: emergency-dockerfiles
      - name: docker-config
        secret:
          secretName: regcred
          items:
          - key: .dockerconfigjson
            path: config.json
---
apiVersion: batch/v1
kind: Job
metadata:
  name: emergency-rebuild-go
  namespace: codequal-dev
spec:
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
          - "--dockerfile=/workspace/Dockerfile.go"
          - "--context=dir:///workspace"
          - "--destination=registry.digitalocean.com/codequal/analyzer:lang-go-v3"
          - "--cache=false"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: docker-config
          mountPath: /kaniko/.docker
      restartPolicy: Never
      volumes:
      - name: dockerfile
        configMap:
          name: emergency-dockerfiles
      - name: docker-config
        secret:
          secretName: regcred
          items:
          - key: .dockerconfigjson
            path: config.json