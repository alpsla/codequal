apiVersion: batch/v1
kind: Job
metadata:
  name: build-rust-v5-do
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--context=dir:///workspace"
        - "--dockerfile=/workspace/Dockerfile.rust"
        - "--destination=registry.digitalocean.com/codequal-registry/analyzer:lang-rust-v5"
        - "--cache=true"
        - "--cache-repo=registry.digitalocean.com/codequal-registry/cache"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: kaniko-secret
          mountPath: /kaniko/.docker
        resources:
          requests:
            memory: "1Gi"
            cpu: "400m"
          limits:
            memory: "2Gi"
            cpu: "800m"
      volumes:
      - name: dockerfile
        configMap:
          name: dockerfile-rust-v5-fixed
      - name: kaniko-secret
        secret:
          secretName: registry-codequal
          items:
          - key: .dockerconfigjson
            path: config.json