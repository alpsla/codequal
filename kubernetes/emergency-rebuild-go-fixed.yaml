apiVersion: v1
kind: ConfigMap
metadata:
  name: emergency-go-dockerfile
  namespace: codequal-dev
data:
  Dockerfile.go: |
    FROM golang:1.21-alpine
    
    # Install Go analysis tools with compatible versions
    RUN apk add --no-cache git gcc musl-dev && \
        go install honnef.co/go/tools/cmd/staticcheck@v0.4.7 && \
        go install golang.org/x/tools/cmd/goimports@latest && \
        go install github.com/securego/gosec/v2/cmd/gosec@latest && \
        go clean -cache
    
    WORKDIR /workspace
    CMD ["/bin/sh"]

---
apiVersion: batch/v1
kind: Job
metadata:
  name: emergency-rebuild-go-fixed
  namespace: codequal-dev
spec:
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
          - "--dockerfile=/workspace/Dockerfile.go"
          - "--context=dir:///workspace"
          - "--destination=registry.digitalocean.com/codequal/analyzer:lang-go-v3"
          - "--cache=false"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: docker-config
          mountPath: /kaniko/.docker
      restartPolicy: Never
      volumes:
      - name: dockerfile
        configMap:
          name: emergency-go-dockerfile
      - name: docker-config
        secret:
          secretName: regcred
          items:
          - key: .dockerconfigjson
            path: config.json