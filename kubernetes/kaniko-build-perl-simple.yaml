apiVersion: v1
kind: ConfigMap
metadata:
  name: perl-dockerfile-simple
  namespace: codequal-dev
data:
  Dockerfile.perl: |
    FROM perl:5.38-slim
    WORKDIR /app
    # Skip Perl::Critic for now due to build issues
    # Just have base Perl for initial testing
    CMD ["perl", "--version"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-perl-simple
  namespace: codequal-dev
spec:
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
          - "--dockerfile=/workspace/Dockerfile.perl"
          - "--context=/workspace"
          - "--destination=registry.digitalocean.com/codequal/analyzer:lang-perl-v2"
          - "--cache=true"
          - "--cache-repo=registry.digitalocean.com/codequal/analyzer/cache"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: kaniko-secret
          mountPath: /kaniko/.docker
      restartPolicy: Never
      volumes:
      - name: dockerfile
        configMap:
          name: perl-dockerfile-simple
          items:
          - key: Dockerfile.perl
            path: Dockerfile.perl
      - name: kaniko-secret
        secret:
          secretName: regcred
          items:
            - key: .dockerconfigjson
              path: config.json