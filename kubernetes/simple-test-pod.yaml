apiVersion: v1
kind: Pod
metadata:
  name: codequal-test
  namespace: codequal-dev
spec:
  containers:
  - name: analyzer
    image: ubuntu:22.04
    command: ["/bin/bash", "-c"]
    args: 
    - |
      echo "CodeQual test pod running"
      apt-get update && apt-get install -y python3-pip
      pip3 install --break-system-packages bandit
      bandit --version
      echo "Ready for analysis"
      while true; do
        echo "Healthy at $(date)"
        sleep 30
      done
    resources:
      requests:
        memory: "512Mi"
        cpu: "250m"
      limits:
        memory: "1Gi"
        cpu: "500m"