# CodeQual Quality-First Deployment
# Complete Kubernetes manifests for 85-tool analysis system
# Designed for 8GB cluster with sequential execution

---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: codequal
  labels:
    app: codequal
    strategy: quality-first
    environment: production

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: codequal-config
  namespace: codequal
data:
  ENVIRONMENT: "production"
  EXECUTION_MODE: "language-specific"
  TOTAL_TOOLS: "85"
  MAX_ANALYSIS_TIME: "300"  # Reduced from 600 (10min) to 300 (5min)
  BATCH_STRATEGY: "language-optimized"
  ENABLE_CACHE: "true"
  REDIS_URL: "redis://redis-service:6379"
  LOG_LEVEL: "info"
  CONCURRENT_ANALYSES: "2"  # Can run 2-4 PRs concurrently
  LANGUAGE_DETECTION: "true"
  CACHE_FILE_CONTENTS: "true"  # Cache file contents to avoid repeated I/O

---
# Secret template (replace with actual values)
apiVersion: v1
kind: Secret
metadata:
  name: codequal-secrets
  namespace: codequal
type: Opaque
stringData:
  DATABASE_URL: "postgresql://username:password@db.supabase.co:5432/postgres"
  SUPABASE_URL: "https://yourproject.supabase.co"
  SUPABASE_SERVICE_KEY: "your-service-key-here"
  GITHUB_TOKEN: "ghp_your_github_token"
  OPENROUTER_API_KEY: "sk-or-your-key"
  REGISTRY_TOKEN: "your-registry-token"

---
# PVC for analysis results
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: analysis-results-pvc
  namespace: codequal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: do-block-storage

---
# PVC for Redis data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data-pvc
  namespace: codequal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: do-block-storage

---
# Redis Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: codequal
  labels:
    app: redis
    component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
          - redis-server
          - --maxmemory
          - 400mb
          - --maxmemory-policy
          - lru
        resources:
          requests:
            memory: "400Mi"
            cpu: "100m"
          limits:
            memory: "500Mi"
            cpu: "200m"
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          tcpSocket:
            port: redis
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data-pvc

---
# Redis Service
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: codequal
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP

---
# Main Analyzer Deployment (85 tools)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codequal-analyzer
  namespace: codequal
  labels:
    app: analyzer
    strategy: quality-first
spec:
  replicas: 1  # Only 1 replica for sequential execution
  strategy:
    type: Recreate  # Ensures clean state between deployments
  selector:
    matchLabels:
      app: analyzer
  template:
    metadata:
      labels:
        app: analyzer
        version: all-85-tools
    spec:
      containers:
      - name: analyzer
        image: registry.digitalocean.com/codequal/analyzer:all-tools-v1
        imagePullPolicy: Always
        resources:
          requests:
            memory: "3Gi"
            cpu: "1000m"
          limits:
            memory: "3.5Gi"  # Fits within 4GB available
            cpu: "2000m"
        env:
        - name: NODE_ENV
          value: "production"
        - name: EXECUTION_MODE
          valueFrom:
            configMapKeyRef:
              name: codequal-config
              key: EXECUTION_MODE
        - name: TOTAL_TOOLS
          valueFrom:
            configMapKeyRef:
              name: codequal-config
              key: TOTAL_TOOLS
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: codequal-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: codequal-config
              key: REDIS_URL
        - name: ENABLE_CACHE
          valueFrom:
            configMapKeyRef:
              name: codequal-config
              key: ENABLE_CACHE
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: results
          mountPath: /results
        - name: cache
          mountPath: /cache
        ports:
        - containerPort: 8080
          name: http
        livenessProbe:
          exec:
            command:
            - /usr/local/bin/verify-all-tools
          initialDelaySeconds: 60
          periodSeconds: 300
          timeoutSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: workspace
        emptyDir:
          sizeLimit: 5Gi
      - name: results
        persistentVolumeClaim:
          claimName: analysis-results-pvc
      - name: cache
        emptyDir:
          sizeLimit: 2Gi
      imagePullSecrets:
      - name: registry-credentials

---
# Analyzer Service
apiVersion: v1
kind: Service
metadata:
  name: analyzer-service
  namespace: codequal
spec:
  selector:
    app: analyzer
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP

---
# API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codequal-api
  namespace: codequal
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: registry.digitalocean.com/codequal/api:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "400Mi"
            cpu: "200m"
          limits:
            memory: "500Mi"
            cpu: "500m"
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: codequal-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: codequal-config
              key: REDIS_URL
        - name: ANALYZER_SERVICE_URL
          value: "http://analyzer-service:8080"
        - name: EXECUTION_MODE
          valueFrom:
            configMapKeyRef:
              name: codequal-config
              key: EXECUTION_MODE
        ports:
        - containerPort: 3000
          name: http
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
      imagePullSecrets:
      - name: registry-credentials

---
# API Service (LoadBalancer for external access)
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: codequal
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-protocol: "http"
    service.beta.kubernetes.io/do-loadbalancer-tls-ports: "443"
    service.beta.kubernetes.io/do-loadbalancer-certificate-id: "your-cert-id"
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 3000
    protocol: TCP

---
# Background Worker Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codequal-worker
  namespace: codequal
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: registry.digitalocean.com/codequal/worker:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "400Mi"
            cpu: "200m"
          limits:
            memory: "500Mi"
            cpu: "500m"
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: codequal-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: codequal-config
              key: REDIS_URL
        - name: ANALYZER_SERVICE_URL
          value: "http://analyzer-service:8080"
        - name: WORKER_CONCURRENCY
          value: "2"
      imagePullSecrets:
      - name: registry-credentials

---
# Web Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codequal-web
  namespace: codequal
  labels:
    app: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: registry.digitalocean.com/codequal/web:latest
        imagePullPolicy: Always
        resources:
          requests:
            memory: "400Mi"
            cpu: "200m"
          limits:
            memory: "500Mi"
            cpu: "500m"
        env:
        - name: NODE_ENV
          value: "production"
        - name: API_URL
          value: "http://api-service:3000"
        ports:
        - containerPort: 3000
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
      imagePullSecrets:
      - name: registry-credentials

---
# Web Service
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: codequal
spec:
  selector:
    app: web
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP

---
# Ingress for routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codequal-ingress
  namespace: codequal
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - app.codequal.com
    - api.codequal.com
    secretName: codequal-tls
  rules:
  - host: app.codequal.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 80
  - host: api.codequal.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 80

---
# Resource Quotas for namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: codequal-quota
  namespace: codequal
spec:
  hard:
    requests.cpu: "5"
    requests.memory: 7Gi
    limits.cpu: "8"
    limits.memory: 7.5Gi
    persistentvolumeclaims: "5"
    services.loadbalancers: "2"

---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codequal-network-policy
  namespace: codequal
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: codequal
    - podSelector: {}
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: codequal
    - podSelector: {}
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443  # HTTPS for external services
    - protocol: TCP
      port: 5432 # PostgreSQL

---
# HPA for API (when you scale)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: codequal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codequal-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80