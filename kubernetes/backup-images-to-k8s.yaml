apiVersion: batch/v1
kind: Job
metadata:
  name: backup-registry-images
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 86400  # Keep for 24 hours
  template:
    spec:
      containers:
      - name: backup
        image: gcr.io/kaniko-project/warmer:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "📦 Caching registry images to Kubernetes storage"
          echo "================================================="
          
          # List of images to cache
          images="
          registry.digitalocean.com/codequal/analyzer:lang-python-v3
          registry.digitalocean.com/codequal/analyzer:lang-javascript-v3
          registry.digitalocean.com/codequal/analyzer:lang-java-v3
          registry.digitalocean.com/codequal/analyzer:lang-go-v3
          registry.digitalocean.com/codequal/analyzer:lang-ruby-v3
          registry.digitalocean.com/codequal/analyzer:lang-php-v3
          registry.digitalocean.com/codequal/analyzer:lang-cpp-v3
          registry.digitalocean.com/codequal/analyzer:lang-csharp-v3
          registry.digitalocean.com/codequal/analyzer:lang-perl-v3
          "
          
          for img in $images; do
            echo "Warming cache for: $img"
            /kaniko/warmer --cache-dir=/cache --image=$img || true
          done
          
          echo "✅ All images cached to /cache"
          ls -lah /cache/
          du -sh /cache/
        volumeMounts:
        - name: cache-storage
          mountPath: /cache
        - name: kaniko-secret
          mountPath: /kaniko/.docker
      restartPolicy: Never
      volumes:
      - name: cache-storage
        persistentVolumeClaim:
          claimName: image-cache-pvc
      - name: kaniko-secret
        secret:
          secretName: regcred
          items:
          - key: .dockerconfigjson
            path: config.json
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: image-cache-pvc
  namespace: codequal-dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi  # 10GB should be enough for cached images
  storageClassName: do-block-storage  # DigitalOcean block storage