apiVersion: v1
kind: ConfigMap
metadata:
  name: remaining-language-dockerfiles
  namespace: codequal-dev
data:
  Dockerfile.java: |
    FROM openjdk:17-slim
    WORKDIR /app
    RUN apt-get update && apt-get install -y wget unzip && \
        wget https://github.com/spotbugs/spotbugs/releases/download/4.7.3/spotbugs-4.7.3.zip && \
        unzip spotbugs-4.7.3.zip && rm spotbugs-4.7.3.zip && \
        apt-get clean && rm -rf /var/lib/apt/lists/*
    CMD ["java", "--version"]
  
  Dockerfile.php: |
    FROM php:8.2-cli
    WORKDIR /app
    RUN apt-get update && apt-get install -y git unzip && \
        curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer && \
        composer global require phpmd/phpmd phpstan/phpstan && \
        apt-get clean && rm -rf /var/lib/apt/lists/*
    CMD ["php", "--version"]
  
  Dockerfile.csharp: |
    FROM mcr.microsoft.com/dotnet/sdk:7.0
    WORKDIR /app
    RUN dotnet tool install --global dotnet-format
    ENV PATH="${PATH}:/root/.dotnet/tools"
    CMD ["dotnet", "--version"]
  
  Dockerfile.perl: |
    FROM perl:5.38-slim
    WORKDIR /app
    RUN cpan install Perl::Critic
    CMD ["perl", "--version"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-java
  namespace: codequal-dev
spec:
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
          - "--dockerfile=/workspace/Dockerfile.java"
          - "--context=/workspace"
          - "--destination=registry.digitalocean.com/codequal/analyzer:lang-java-v2"
          - "--cache=true"
          - "--cache-repo=registry.digitalocean.com/codequal/analyzer/cache"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: kaniko-secret
          mountPath: /kaniko/.docker
      restartPolicy: Never
      volumes:
      - name: dockerfile
        configMap:
          name: remaining-language-dockerfiles
          items:
          - key: Dockerfile.java
            path: Dockerfile.java
      - name: kaniko-secret
        secret:
          secretName: regcred
          items:
            - key: .dockerconfigjson
              path: config.json
---
