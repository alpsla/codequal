apiVersion: apps/v1
kind: Deployment
metadata:
  name: codequal-analyzer
  namespace: codequal-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codequal-analyzer
  template:
    metadata:
      labels:
        app: codequal-analyzer
    spec:
      containers:
      - name: analyzer
        image: registry.digitalocean.com/codequal/analyzer:working-v1
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        env:
        - name: NODE_ENV
          value: "production"
        - name: LOG_LEVEL
          value: "info"
      imagePullSecrets:
      - name: registry-credentials
---
apiVersion: v1
kind: Service
metadata:
  name: codequal-analyzer-service
  namespace: codequal-dev
spec:
  selector:
    app: codequal-analyzer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP