---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-python-v4-1
  namespace: codequal-dev
spec:
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=/workspace/Dockerfile"
        - "--context=dir://workspace"
        - "--destination=registry.digitalocean.com/codequal-registry/analyzer:lang-python-v4.1"
        - "--cache=true"
        - "--cache-ttl=24h"
        - "--skip-tls-verify"
        volumeMounts:
        - name: dockerfile-volume
          mountPath: /workspace
        - name: docker-config
          mountPath: /kaniko/.docker
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      restartPolicy: Never
      volumes:
      - name: dockerfile-volume
        configMap:
          name: dockerfile-python-v4-1
      - name: docker-config
        secret:
          secretName: registry-codequal
          items:
          - key: .dockerconfigjson
            path: config.json

