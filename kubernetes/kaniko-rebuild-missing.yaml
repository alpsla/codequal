apiVersion: batch/v1
kind: Job
metadata:
  name: rebuild-go-v3
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=Dockerfile.go"
        - "--context=dir:///workspace"
        - "--destination=registry.digitalocean.com/codequal/analyzer:lang-go-v3"
        - "--cache=true"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: kaniko-secret
          mountPath: /kaniko/.docker
      restartPolicy: Never
      volumes:
      - name: dockerfile
        configMap:
          name: language-dockerfiles
      - name: kaniko-secret
        secret:
          secretName: regcred
          items:
          - key: .dockerconfigjson
            path: config.json
---
