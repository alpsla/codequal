---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analyzer-python
  namespace: codequal-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analyzer-python
      language: python
  template:
    metadata:
      labels:
        app: analyzer-python
        language: python
    spec:
      containers:
      - name: analyzer
        image: registry.digitalocean.com/codequal/analyzer:lang-python
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
