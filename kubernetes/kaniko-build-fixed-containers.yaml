apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-python-fixed
  namespace: codequal-dev
spec:
  template:
    spec:
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
          - "--dockerfile=/workspace/Dockerfile.python.fixed"
          - "--context=dir:///workspace"
          - "--destination=registry.digitalocean.com/codequal-registry/analyzer:lang-python-v4"
          - "--cache=true"
          - "--cache-ttl=24h"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: kaniko-secret
          mountPath: /kaniko/.docker
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
      restartPolicy: Never
      volumes:
      - name: dockerfile
        configMap:
          name: dockerfile-python-fixed
      - name: kaniko-secret
        secret:
          secretName: regcred
          items:
            - key: .dockerconfigjson
              path: config.json
  backoffLimit: 2
---
