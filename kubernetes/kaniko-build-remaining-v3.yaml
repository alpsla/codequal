apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-cpp-fixed
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM gcc:12
    
    # Install clang, clang-tidy, cppcheck and other C++ tools
    RUN apt-get update && apt-get install -y \
        clang clang-tidy cppcheck valgrind \
        cmake make \
        && rm -rf /var/lib/apt/lists/*
    
    # Create a simple .clang-tidy config
    RUN echo "Checks: '*,-fuchsia-*,-google-*,-llvm-*'" > /etc/.clang-tidy
    
    WORKDIR /workspace
    CMD ["/bin/bash"]
