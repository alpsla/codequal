apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-php-fixed
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM php:8.2-cli
    
    # Install system dependencies
    RUN apt-get update && apt-get install -y \
        git unzip curl libzip-dev \
        && docker-php-ext-install zip \
        && rm -rf /var/lib/apt/lists/*
    
    # Install Composer
    RUN curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    
    # Install PHP analysis tools globally via Composer
    RUN composer global require --no-interaction \
        phpstan/phpstan \
        phpmd/phpmd \
        squizlabs/php_codesniffer \
        vimeo/psalm \
        && composer clear-cache
    
    # Add Composer global bin to PATH
    ENV PATH="/root/.composer/vendor/bin:${PATH}"
    
    # Create default config files
    RUN echo "parameters:" > /etc/phpstan.neon && \
        echo "  level: 5" >> /etc/phpstan.neon && \
        echo "  paths:" >> /etc/phpstan.neon && \
        echo "    - ." >> /etc/phpstan.neon
    
    # Create a simple PHPMD ruleset
    RUN echo '<?xml version="1.0"?>' > /etc/phpmd-ruleset.xml && \
        echo '<ruleset name="PHPMD rule set">' >> /etc/phpmd-ruleset.xml && \
        echo '  <description>Default PHPMD ruleset</description>' >> /etc/phpmd-ruleset.xml && \
        echo '  <rule ref="rulesets/cleancode.xml" />' >> /etc/phpmd-ruleset.xml && \
        echo '  <rule ref="rulesets/codesize.xml" />' >> /etc/phpmd-ruleset.xml && \
        echo '  <rule ref="rulesets/controversial.xml" />' >> /etc/phpmd-ruleset.xml && \
        echo '  <rule ref="rulesets/design.xml" />' >> /etc/phpmd-ruleset.xml && \
        echo '  <rule ref="rulesets/naming.xml" />' >> /etc/phpmd-ruleset.xml && \
        echo '  <rule ref="rulesets/unusedcode.xml" />' >> /etc/phpmd-ruleset.xml && \
        echo '</ruleset>' >> /etc/phpmd-ruleset.xml
    
    WORKDIR /workspace
    CMD ["/bin/bash"]
---
