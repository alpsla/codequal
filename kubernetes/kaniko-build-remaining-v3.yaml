apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-perl-fixed
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM perl:5.38-slim
    
    # Install build tools and cpanminus
    RUN apt-get update && apt-get install -y \
        build-essential cpanminus \
        && rm -rf /var/lib/apt/lists/*
    
    # Install Perl::Critic and Perl::Tidy
    RUN cpanm --notest \
        Perl::Critic \
        Perl::Tidy \
        Test::Perl::Critic \
        Perl::Critic::Policy::Subroutines::ProhibitExplicitReturnUndef \
        Perl::Critic::Policy::TestingAndDebugging::RequireUseStrict \
        Perl::Critic::Policy::TestingAndDebugging::RequireUseWarnings
    
    # Create a default .perlcriticrc with reasonable defaults
    RUN echo "# Default Perl::Critic configuration" > /etc/.perlcriticrc && \
        echo "severity = 3" >> /etc/.perlcriticrc && \
        echo "verbose = 8" >> /etc/.perlcriticrc && \
        echo "" >> /etc/.perlcriticrc && \
        echo "[TestingAndDebugging::RequireUseStrict]" >> /etc/.perlcriticrc && \
        echo "severity = 5" >> /etc/.perlcriticrc && \
        echo "" >> /etc/.perlcriticrc && \
        echo "[TestingAndDebugging::RequireUseWarnings]" >> /etc/.perlcriticrc && \
        echo "severity = 5" >> /etc/.perlcriticrc
    
    # Create a default .perltidyrc
    RUN echo "# Default Perl::Tidy configuration" > /etc/.perltidyrc && \
        echo "-l=120    # Max line length" >> /etc/.perltidyrc && \
        echo "-i=4      # Indent level" >> /etc/.perltidyrc && \
        echo "-ci=4     # Continuation indent" >> /etc/.perltidyrc && \
        echo "-st       # Output to STDOUT" >> /etc/.perltidyrc && \
        echo "-se       # Errors to STDERR" >> /etc/.perltidyrc && \
        echo "-vt=2     # Vertical tightness" >> /etc/.perltidyrc && \
        echo "-cti=0    # No extra indentation for closing brackets" >> /etc/.perltidyrc && \
        echo "-pt=1     # Medium parenthesis tightness" >> /etc/.perltidyrc && \
        echo "-bt=1     # Medium brace tightness" >> /etc/.perltidyrc && \
        echo "-sbt=1    # Medium square bracket tightness" >> /etc/.perltidyrc && \
        echo "-bbt=1    # Medium block brace tightness" >> /etc/.perltidyrc && \
        echo "-nsfs     # No space before semicolons" >> /etc/.perltidyrc && \
        echo "-nolq     # Don't outdent long quotes" >> /etc/.perltidyrc
    
    # Verify installations work
    RUN perl -MPerl::Critic -e 'print "Perl::Critic installed\n"' && \
        perl -MPerl::Tidy -e 'print "Perl::Tidy installed\n"'
    
    WORKDIR /workspace
    CMD ["/bin/bash"]