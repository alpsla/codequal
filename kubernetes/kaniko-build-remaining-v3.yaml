apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-ruby-fixed
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM ruby:3.2-slim
    
    # Install dependencies
    RUN apt-get update && apt-get install -y \
        build-essential git \
        && rm -rf /var/lib/apt/lists/*
    
    # Install Ruby analysis tools
    RUN gem install rubocop brakeman bundler-audit rails_best_practices reek
    
    # Create a default RuboCop config that works
    RUN echo "AllCops:" > /etc/.rubocop.yml && \
        echo "  NewCops: enable" >> /etc/.rubocop.yml && \
        echo "  TargetRubyVersion: 3.2" >> /etc/.rubocop.yml
    
    WORKDIR /workspace
    CMD ["/bin/bash"]
---
