apiVersion: batch/v1
kind: Job
metadata:
  name: build-java-v3
  namespace: codequal-dev
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=/workspace/Dockerfile"
        - "--context=dir:///workspace"
        - "--destination=registry.digitalocean.com/codequal/analyzer:lang-java-v3"
        - "--cache=false"
        - "--cleanup"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: docker-config
          mountPath: /kaniko/.docker
      volumes:
      - name: dockerfile
        configMap:
          name: dockerfile-java-fixed
      - name: docker-config
        secret:
          secretName: regcred
          items:
          - key: .dockerconfigjson
            path: config.json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-java-fixed
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM openjdk:17-slim
    
    # Install build tools and analysis tools
    RUN apt-get update && apt-get install -y \
        wget unzip maven gradle \
        && rm -rf /var/lib/apt/lists/*
    
    # Install SpotBugs
    ENV SPOTBUGS_VERSION=4.8.3
    RUN wget -q https://github.com/spotbugs/spotbugs/releases/download/${SPOTBUGS_VERSION}/spotbugs-${SPOTBUGS_VERSION}.zip \
        && unzip -q spotbugs-${SPOTBUGS_VERSION}.zip -d /opt \
        && rm spotbugs-${SPOTBUGS_VERSION}.zip \
        && ln -s /opt/spotbugs-${SPOTBUGS_VERSION}/bin/spotbugs /usr/local/bin/spotbugs \
        && chmod +x /usr/local/bin/spotbugs
    
    # Install PMD
    ENV PMD_VERSION=7.0.0-rc4
    RUN wget -q https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip \
        && unzip -q pmd-dist-${PMD_VERSION}-bin.zip -d /opt \
        && rm pmd-dist-${PMD_VERSION}-bin.zip \
        && ln -s /opt/pmd-bin-${PMD_VERSION}/bin/pmd /usr/local/bin/pmd \
        && chmod +x /usr/local/bin/pmd
    
    WORKDIR /workspace
    CMD ["/bin/bash"]
---
