apiVersion: v1
kind: ConfigMap
metadata:
  name: test-files-v4
  namespace: codequal-dev
data:
  # Python test file with common issues
  test.py: |
    import os
    import sys
    
    # Undefined variable issue
    def calculate_sum():
        result = a + b  # NameError: name 'a' is not defined
        return result
    
    # Unused import
    import json
    
    # Long line issue
    very_long_variable_name = "This is a very long string that should trigger a line length warning in most Python linters and code analysis tools"
    
    # Missing docstring
    def process_data(data):
        if data == None:  # Use 'is None' instead
            return []
        return data.split(',')
    
    # Potential security issue
    exec(user_input)  # Dangerous use of exec
    
    if __name__ == "__main__":
        calculate_sum()

  # JavaScript test file with common issues
  test.js: |
    // Missing semicolon
    var x = 5
    var y = 10
    
    // Unused variable
    var unusedVar = "not used";
    
    // Undefined variable
    function calculateSum() {
        return a + b; // 'a' and 'b' are not defined
    }
    
    // Equality comparison issue
    if (x == "5") {
        console.log("Should use === instead of ==");
    }
    
    // Missing var/let/const
    globalVar = "This creates a global variable";
    
    // Potential security issue
    eval(userInput); // Dangerous use of eval
    
    // Function without return
    function processData(data) {
        data.split(',');
    }

  # TypeScript test file with common issues  
  test.ts: |
    // Missing type annotations
    function calculateSum(a, b) {
        return a + b;
    }
    
    // Any type usage
    let data: any = getData();
    
    // Unused variable
    const unusedConst = "not used";
    
    // Undefined variable
    function processData() {
        return undefinedVar; // Variable not defined
    }
    
    // Interface with optional properties
    interface User {
        name: string;
        age: number;
        email?: string;
    }
    
    // Missing null check
    function getUserName(user: User): string {
        return user.name.toUpperCase(); // Potential null reference
    }
    
    // Potential security issue
    const result = eval(userInput); // Dangerous use of eval

  # Java test file with common issues
  Test.java: |
    import java.util.*;
    import java.io.*;
    
    public class Test {
        // Unused variable
        private static final String UNUSED_CONSTANT = "not used";
        
        // Missing exception handling
        public static void readFile() {
            FileReader fr = new FileReader("nonexistent.txt"); // IOException not handled
        }
        
        // Potential null pointer
        public static String processString(String input) {
            return input.toUpperCase(); // Potential NPE if input is null
        }
        
        // Unused import and method
        public static void unusedMethod() {
            System.out.println("This method is never called");
        }
        
        // Resource leak
        public static void resourceLeak() {
            try {
                FileInputStream fis = new FileInputStream("test.txt");
                // Stream not closed
            } catch (Exception e) {
                e.printStackTrace();
            }
        }
        
        // Magic number
        public static void calculate() {
            int result = someValue * 42; // Magic number
        }
        
        public static void main(String[] args) {
            processString(null);
        }
    }

  # PHP test file with common issues
  test.php: |
    <?php
    
    // Unused variable
    $unusedVariable = "not used";
    
    // Undefined variable
    function calculateSum() {
        return $a + $b; // Variables not defined
    }
    
    // Missing error handling
    function readFile() {
        $content = file_get_contents("nonexistent.txt"); // No error handling
        return $content;
    }
    
    // SQL injection potential
    function getUser($id) {
        $query = "SELECT * FROM users WHERE id = " . $id; // SQL injection risk
        return mysql_query($query);
    }
    
    // XSS vulnerability
    function displayMessage($message) {
        echo $message; // Should escape output
    }
    
    // Deprecated function
    function connectDatabase() {
        return mysql_connect("localhost", "user", "pass"); // mysql_connect is deprecated
    }
    
    // Missing validation
    if ($_POST['action'] == 'delete') {
        deleteUser($_POST['id']); // No CSRF protection or validation
    }
    
    ?>

---
# Python v4 Test Job
apiVersion: batch/v1
kind: Job
metadata:
  name: test-python-v4
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      imagePullSecrets:
      - name: registry-codequal
      restartPolicy: Never
      containers:
      - name: test-container
        image: registry.digitalocean.com/codequal-registry/analyzer:lang-python-v4
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "=== Testing Python v4 Container ==="
          echo "Container: lang-python-v4"
          echo "Timestamp: $(date)"
          echo ""
          
          # Copy test file
          cp /test-files/test.py /tmp/test.py
          
          # Run Python analysis tools
          echo "=== Running flake8 ==="
          flake8 /tmp/test.py 2>&1 || true
          echo ""
          
          echo "=== Running pylint ==="
          pylint /tmp/test.py 2>&1 || true
          echo ""
          
          echo "=== Running bandit (security) ==="
          bandit /tmp/test.py 2>&1 || true
          echo ""
          
          echo "=== Testing Python syntax check ==="
          python -m py_compile /tmp/test.py 2>&1 || true
          echo ""
          
          echo "=== Container test completed ==="
        volumeMounts:
        - name: test-files
          mountPath: /test-files
      volumes:
      - name: test-files
        configMap:
          name: test-files-v4

