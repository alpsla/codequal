# PHP v4 Test Job
apiVersion: batch/v1
kind: Job
metadata:
  name: test-php-v4
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      imagePullSecrets:
      - name: registry-codequal
      restartPolicy: Never
      containers:
      - name: test-container
        image: registry.digitalocean.com/codequal-registry/analyzer:lang-php-v4
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "=== Testing PHP v4 Container ==="
          echo "Container: lang-php-v4"
          echo "Timestamp: $(date)"
          echo ""
          
          # Copy test file
          cp /test-files/test.php /tmp/test.php
          
          # Run PHP analysis tools
          echo "=== Running PHP Syntax Check ==="
          php -l /tmp/test.php 2>&1 || true
          echo ""
          
          echo "=== Running PHPCS (CodeSniffer) ==="
          phpcs /tmp/test.php 2>&1 || true
          echo ""
          
          echo "=== Running PHPStan ==="
          phpstan analyse /tmp/test.php --level=5 2>&1 || true
          echo ""
          
          echo "=== Running PHPMD ==="
          phpmd /tmp/test.php text cleancode,codesize,controversial,design,naming,unusedcode 2>&1 || true
          echo ""
          
          echo "=== Container test completed ==="
        volumeMounts:
        - name: test-files
          mountPath: /test-files
      volumes:
      - name: test-files
        configMap:
          name: test-files-v4