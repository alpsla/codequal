# TypeScript v4.1 Test Job
apiVersion: batch/v1
kind: Job
metadata:
  name: test-typescript-v41
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      imagePullSecrets:
      - name: registry-codequal
      restartPolicy: Never
      containers:
      - name: test-container
        image: registry.digitalocean.com/codequal-registry/analyzer:lang-typescript-v4.1
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "=== Testing TypeScript v4.1 Container ==="
          echo "Container: lang-typescript-v4.1"
          echo "Timestamp: $(date)"
          echo ""
          
          # Copy test file
          cp /test-files/test.ts /tmp/test.ts
          
          # Create basic tsconfig.json
          cat > /tmp/tsconfig.json << 'EOF'
          {
            "compilerOptions": {
              "target": "es2020",
              "module": "commonjs",
              "strict": true,
              "noImplicitAny": true
            }
          }
          EOF
          
          # Run TypeScript analysis tools
          echo "=== Running TypeScript Compiler ==="
          tsc --noEmit /tmp/test.ts 2>&1 || true
          echo ""
          
          echo "=== Running TSLint ==="
          tslint /tmp/test.ts 2>&1 || true
          echo ""
          
          echo "=== Running ESLint with TypeScript ==="
          eslint /tmp/test.ts 2>&1 || true
          echo ""
          
          echo "=== Container test completed ==="
        volumeMounts:
        - name: test-files
          mountPath: /test-files
      volumes:
      - name: test-files
        configMap:
          name: test-files-v4

---
# Java v4 Test Job
apiVersion: batch/v1
kind: Job
metadata:
  name: test-java-v4
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      imagePullSecrets:
      - name: registry-codequal
      restartPolicy: Never
      containers:
      - name: test-container
        image: registry.digitalocean.com/codequal-registry/analyzer:lang-java-v4
        command: ["/bin/bash"]
        args:
        - -c
        - |
          echo "=== Testing Java v4 Container ==="
          echo "Container: lang-java-v4"
          echo "Timestamp: $(date)"
          echo ""
          
          # Copy test file
          cp /test-files/Test.java /tmp/Test.java
          
          # Run Java analysis tools
          echo "=== Running Java Compiler ==="
          javac /tmp/Test.java 2>&1 || true
          echo ""
          
          echo "=== Running CheckStyle ==="
          checkstyle /tmp/Test.java 2>&1 || true
          echo ""
          
          echo "=== Running SpotBugs ==="
          # Compile first for SpotBugs
          javac /tmp/Test.java -d /tmp 2>/dev/null || true
          spotbugs -textui /tmp 2>&1 || true
          echo ""
          
          echo "=== Running PMD ==="
          pmd -d /tmp -f text -rulesets java-basic 2>&1 || true
          echo ""
          
          echo "=== Container test completed ==="
        volumeMounts:
        - name: test-files
          mountPath: /test-files
      volumes:
      - name: test-files
        configMap:
          name: test-files-v4

