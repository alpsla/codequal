apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-java-v5-simple
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM registry.digitalocean.com/codequal-registry/analyzer:lang-java-v4.9

    USER root

    # Install additional tools
    RUN apt-get update && apt-get install -y \
        python3 python3-pip unzip \
        && rm -rf /var/lib/apt/lists/*

    WORKDIR /tools

    # Checkstyle - Use direct JAR download
    RUN wget -q https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.5/checkstyle-10.12.5-all.jar && \
        mv checkstyle-10.12.5-all.jar /opt/checkstyle.jar && \
        echo '#!/bin/bash' > /usr/local/bin/checkstyle && \
        echo 'java -jar /opt/checkstyle.jar "$@"' >> /usr/local/bin/checkstyle && \
        chmod +x /usr/local/bin/checkstyle

    # Create a basic checkstyle config to avoid downloading Google checks
    RUN cat > /google_checks.xml << 'EOF'
    <?xml version="1.0"?>
    <!DOCTYPE module PUBLIC
        "-//Checkstyle//DTD Checkstyle Configuration 1.3//EN"
        "https://checkstyle.org/dtds/configuration_1_3.dtd">
    <module name="Checker">
      <property name="charset" value="UTF-8"/>
      <property name="severity" value="warning"/>
      <property name="fileExtensions" value="java, properties, xml"/>

      <!-- Basic checks -->
      <module name="TreeWalker">
        <module name="OuterTypeFilename"/>
        <module name="IllegalTokenText">
          <property name="tokens" value="STRING_LITERAL, CHAR_LITERAL"/>
          <property name="format" value="\\u00(09|0(a|A)|0(c|C)|0(d|D)|22|27|5(C|c))|\\(0(10|11|12|14|15|16|17|20|21|23|24|25|26|27|30|31)"/>
          <property name="message" value="Consider using special escape sequence instead of octal value or Unicode escaped value."/>
        </module>
        <module name="AvoidEscapedUnicodeCharacters">
          <property name="allowEscapesForControlCharacters" value="true"/>
          <property name="allowByTailComment" value="true"/>
          <property name="allowNonPrintableEscapes" value="true"/>
        </module>
        <module name="AvoidStarImport"/>
        <module name="OneTopLevelClass"/>
        <module name="NoLineWrap"/>
        <module name="EmptyBlock">
          <property name="option" value="TEXT"/>
          <property name="tokens" value="LITERAL_TRY, LITERAL_FINALLY, LITERAL_IF, LITERAL_ELSE, LITERAL_SWITCH"/>
        </module>
        <module name="NeedBraces"/>
        <module name="LeftCurly"/>
        <module name="RightCurly">
          <property name="id" value="RightCurlySame"/>
          <property name="tokens" value="LITERAL_TRY, LITERAL_CATCH, LITERAL_FINALLY, LITERAL_IF, LITERAL_ELSE, LITERAL_DO"/>
        </module>
        <module name="RightCurly">
          <property name="id" value="RightCurlyAlone"/>
          <property name="option" value="alone"/>
          <property name="tokens" value="CLASS_DEF, METHOD_DEF, CTOR_DEF, LITERAL_FOR, LITERAL_WHILE, STATIC_INIT, INSTANCE_INIT"/>
        </module>
        <module name="WhitespaceAround">
          <property name="allowEmptyConstructors" value="true"/>
          <property name="allowEmptyMethods" value="true"/>
          <property name="allowEmptyTypes" value="true"/>
          <property name="allowEmptyLoops" value="true"/>
        </module>
        <module name="OneStatementPerLine"/>
        <module name="MultipleVariableDeclarations"/>
        <module name="ArrayTypeStyle"/>
        <module name="MissingSwitchDefault"/>
        <module name="FallThrough"/>
        <module name="UpperEll"/>
        <module name="ModifierOrder"/>
        <module name="EmptyLineSeparator">
          <property name="allowNoEmptyLineBetweenFields" value="true"/>
        </module>
        <module name="SeparatorWrap">
          <property name="id" value="SeparatorWrapDot"/>
          <property name="tokens" value="DOT"/>
          <property name="option" value="nl"/>
        </module>
        <module name="SeparatorWrap">
          <property name="id" value="SeparatorWrapComma"/>
          <property name="tokens" value="COMMA"/>
          <property name="option" value="EOL"/>
        </module>
        <module name="PackageName">
          <property name="format" value="^[a-z]+(\.[a-z][a-z0-9]*)*$"/>
        </module>
        <module name="TypeName"/>
        <module name="MemberName"/>
        <module name="ParameterName"/>
        <module name="CatchParameterName"/>
        <module name="LocalVariableName"/>
        <module name="ClassTypeParameterName"/>
        <module name="MethodTypeParameterName"/>
        <module name="InterfaceTypeParameterName"/>
        <module name="NoFinalizer"/>
        <module name="GenericWhitespace"/>
        <module name="Indentation">
          <property name="basicOffset" value="2"/>
          <property name="braceAdjustment" value="0"/>
          <property name="caseIndent" value="2"/>
          <property name="throwsIndent" value="4"/>
          <property name="lineWrappingIndentation" value="4"/>
          <property name="arrayInitIndent" value="2"/>
        </module>
        <module name="AbbreviationAsWordInName">
          <property name="ignoreFinal" value="false"/>
          <property name="allowedAbbreviationLength" value="1"/>
        </module>
        <module name="OverloadMethodsDeclarationOrder"/>
        <module name="VariableDeclarationUsageDistance"/>
        <module name="CustomImportOrder">
          <property name="sortImportsInGroupAlphabetically" value="true"/>
          <property name="separateLineBetweenGroups" value="true"/>
          <property name="customImportOrderRules" value="STATIC###THIRD_PARTY_PACKAGE"/>
        </module>
        <module name="MethodParamPad"/>
        <module name="NoWhitespaceBefore">
          <property name="tokens" value="COMMA, SEMI, POST_INC, POST_DEC, DOT, ELLIPSIS, METHOD_REF"/>
          <property name="allowLineBreaks" value="true"/>
        </module>
        <module name="ParenPad"/>
        <module name="OperatorWrap">
          <property name="option" value="NL"/>
          <property name="tokens" value="BAND, BOR, BSR, BXOR, DIV, EQUAL, GE, GT, LAND, LE, LITERAL_INSTANCEOF, LOR, LT, MINUS, MOD, NOT_EQUAL, PLUS, QUESTION, SL, SR, STAR, METHOD_REF "/>
        </module>
        <module name="AnnotationLocation">
          <property name="id" value="AnnotationLocationMostCases"/>
          <property name="tokens" value="CLASS_DEF, INTERFACE_DEF, ENUM_DEF, METHOD_DEF, CTOR_DEF"/>
        </module>
        <module name="AnnotationLocation">
          <property name="id" value="AnnotationLocationVariables"/>
          <property name="tokens" value="VARIABLE_DEF"/>
          <property name="allowSamelineMultipleAnnotations" value="true"/>
        </module>
        <module name="NonEmptyAtclauseDescription"/>
        <module name="MethodName">
          <property name="format" value="^[a-z][a-z0-9][a-zA-Z0-9_]*$"/>
        </module>
        <module name="SingleLineJavadoc">
          <property name="ignoreInlineTags" value="false"/>
        </module>
        <module name="EmptyCatchBlock">
          <property name="exceptionVariableName" value="expected"/>
        </module>
        <module name="CommentsIndentation"/>
      </module>
    </module>
    EOF

    # Semgrep
    RUN pip3 install --no-cache-dir semgrep==1.45.0

    # Verify installations
    RUN checkstyle --version || echo "Checkstyle version check failed" && \
        semgrep --version || echo "Semgrep version check failed" && \
        pmd --version || echo "PMD version check failed" && \
        spotbugs -version || echo "SpotBugs version check failed"

    WORKDIR /workspace
    CMD ["/bin/bash"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-java-v5-simple
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=/workspace/Dockerfile"
        - "--context=/workspace"
        - "--destination=registry.digitalocean.com/codequal-registry/analyzer:lang-java-v5.0"
        - "--cache=true"
        - "--insecure"
        - "--skip-tls-verify"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: kaniko-secret
          mountPath: /kaniko/.docker
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: dockerfile
        configMap:
          name: dockerfile-java-v5-simple
      - name: kaniko-secret
        secret:
          secretName: kaniko-secret
          items:
          - key: .dockerconfigjson
            path: config.json