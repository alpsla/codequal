# Redis deployment for CodeQual tool output caching
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: codequal-dev
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: codequal-dev
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        command:
        - redis-server
        - --save
        - "60"
        - "1"
        - --loglevel
        - notice
      volumes:
      - name: redis-data
        emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: codequal-dev
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    save 60 1
    appendonly no