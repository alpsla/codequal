apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-java-v5-final
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM openjdk:11-jdk-slim

    RUN apt-get update && apt-get install -y \
        curl wget git python3 python3-pip unzip \
        && rm -rf /var/lib/apt/lists/*

    WORKDIR /tools

    # SpotBugs
    RUN wget -q https://github.com/spotbugs/spotbugs/releases/download/4.8.0/spotbugs-4.8.0.zip && \
        unzip -q spotbugs-4.8.0.zip && \
        mv spotbugs-4.8.0 /opt/spotbugs && \
        rm spotbugs-4.8.0.zip && \
        ln -s /opt/spotbugs/bin/spotbugs /usr/local/bin/spotbugs

    # PMD
    RUN wget -q https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.0.0/pmd-dist-7.0.0-bin.zip && \
        unzip -q pmd-dist-7.0.0-bin.zip && \
        mv pmd-bin-7.0.0 /opt/pmd && \
        rm pmd-dist-7.0.0-bin.zip && \
        ln -s /opt/pmd/bin/pmd /usr/local/bin/pmd

    # Checkstyle
    RUN wget -q https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.5/checkstyle-10.12.5-all.jar && \
        mv checkstyle-10.12.5-all.jar /opt/checkstyle.jar && \
        echo '#!/bin/bash' > /usr/local/bin/checkstyle && \
        echo 'java -jar /opt/checkstyle.jar "$@"' >> /usr/local/bin/checkstyle && \
        chmod +x /usr/local/bin/checkstyle

    # Simple Google checks
    RUN echo '<?xml version="1.0"?>' > /google_checks.xml && \
        echo '<!DOCTYPE module PUBLIC "-//Checkstyle//DTD Checkstyle Configuration 1.3//EN" "https://checkstyle.org/dtds/configuration_1_3.dtd">' >> /google_checks.xml && \
        echo '<module name="Checker">' >> /google_checks.xml && \
        echo '  <property name="charset" value="UTF-8"/>' >> /google_checks.xml && \
        echo '  <property name="fileExtensions" value="java"/>' >> /google_checks.xml && \
        echo '  <module name="TreeWalker">' >> /google_checks.xml && \
        echo '    <module name="LineLength"><property name="max" value="120"/></module>' >> /google_checks.xml && \
        echo '    <module name="AvoidStarImport"/>' >> /google_checks.xml && \
        echo '    <module name="EmptyBlock"/>' >> /google_checks.xml && \
        echo '    <module name="NeedBraces"/>' >> /google_checks.xml && \
        echo '    <module name="OneStatementPerLine"/>' >> /google_checks.xml && \
        echo '    <module name="ArrayTypeStyle"/>' >> /google_checks.xml && \
        echo '    <module name="UpperEll"/>' >> /google_checks.xml && \
        echo '    <module name="ModifierOrder"/>' >> /google_checks.xml && \
        echo '  </module>' >> /google_checks.xml && \
        echo '</module>' >> /google_checks.xml

    # Semgrep
    RUN pip3 install --no-cache-dir semgrep==1.45.0

    ENV SPOTBUGS_HOME=/opt/spotbugs
    ENV PMD_HOME=/opt/pmd
    ENV PATH=$PATH:/opt/spotbugs/bin:/opt/pmd/bin

    WORKDIR /workspace
    CMD ["/bin/bash"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-java-v5-final
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=/workspace/Dockerfile"
        - "--context=/workspace"
        - "--destination=registry.digitalocean.com/codequal-registry/analyzer:lang-java-v5.0"
        - "--cache=true"
        - "--insecure"
        - "--skip-tls-verify"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: kaniko-secret
          mountPath: /kaniko/.docker
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: dockerfile
        configMap:
          name: dockerfile-java-v5-final
      - name: kaniko-secret
        secret:
          secretName: kaniko-secret
          items:
          - key: .dockerconfigjson
            path: config.json