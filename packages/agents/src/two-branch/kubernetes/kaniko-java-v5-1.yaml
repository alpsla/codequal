apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-java-v5-1
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM registry.digitalocean.com/codequal-registry/analyzer:lang-java-v4.9

    USER root

    # Install additional tools
    RUN apt-get update && apt-get install -y \
        python3 python3-pip unzip \
        && rm -rf /var/lib/apt/lists/*

    WORKDIR /tools

    # Checkstyle - Use direct JAR download
    RUN wget -q https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.5/checkstyle-10.12.5-all.jar && \
        mv checkstyle-10.12.5-all.jar /opt/checkstyle.jar && \
        echo '#!/bin/bash' > /usr/local/bin/checkstyle && \
        echo 'java -jar /opt/checkstyle.jar "$@"' >> /usr/local/bin/checkstyle && \
        chmod +x /usr/local/bin/checkstyle

    # Create a working checkstyle config
    RUN cat > /google_checks.xml << 'CHECKSTYLE_EOF'
    <?xml version="1.0"?>
    <!DOCTYPE module PUBLIC
        "-//Checkstyle//DTD Checkstyle Configuration 1.3//EN"
        "https://checkstyle.org/dtds/configuration_1_3.dtd">
    <module name="Checker">
      <property name="severity" value="warning"/>
      <property name="fileExtensions" value="java, properties, xml"/>

      <!-- Checks for whitespace -->
      <module name="FileTabCharacter">
        <property name="eachLine" value="true"/>
      </module>

      <module name="TreeWalker">
        <!-- Naming Conventions -->
        <module name="TypeName"/>
        <module name="MethodName"/>
        <module name="ParameterName"/>
        <module name="LocalVariableName"/>
        <module name="PackageName"/>

        <!-- Imports -->
        <module name="AvoidStarImport"/>
        <module name="IllegalImport"/>
        <module name="RedundantImport"/>
        <module name="UnusedImports"/>

        <!-- Modifiers -->
        <module name="ModifierOrder"/>
        <module name="RedundantModifier"/>

        <!-- Blocks -->
        <module name="AvoidNestedBlocks"/>
        <module name="EmptyBlock"/>
        <module name="LeftCurly"/>
        <module name="NeedBraces"/>
        <module name="RightCurly"/>

        <!-- Class Design -->
        <module name="FinalClass"/>
        <module name="HideUtilityClassConstructor"/>
        <module name="InterfaceIsType"/>
        <module name="VisibilityModifier"/>

        <!-- Coding -->
        <module name="EmptyStatement"/>
        <module name="EqualsHashCode"/>
        <module name="HiddenField"/>
        <module name="IllegalInstantiation"/>
        <module name="InnerAssignment"/>
        <module name="MagicNumber"/>
        <module name="MissingSwitchDefault"/>
        <module name="MultipleVariableDeclarations"/>
        <module name="SimplifyBooleanExpression"/>
        <module name="SimplifyBooleanReturn"/>

        <!-- Miscellaneous -->
        <module name="ArrayTypeStyle"/>
        <module name="FinalParameters"/>
        <module name="TodoComment"/>
        <module name="UpperEll"/>

        <!-- Size Violations -->
        <module name="LineLength">
          <property name="max" value="120"/>
        </module>
        <module name="MethodLength"/>
        <module name="ParameterNumber"/>

        <!-- Whitespace -->
        <module name="EmptyForIteratorPad"/>
        <module name="GenericWhitespace"/>
        <module name="MethodParamPad"/>
        <module name="NoWhitespaceAfter"/>
        <module name="NoWhitespaceBefore"/>
        <module name="OperatorWrap"/>
        <module name="ParenPad"/>
        <module name="TypecastParenPad"/>
        <module name="WhitespaceAfter"/>
        <module name="WhitespaceAround"/>
      </module>
    </module>
    CHECKSTYLE_EOF

    # Semgrep
    RUN pip3 install --no-cache-dir semgrep==1.45.0

    # Verify installations
    RUN echo "=== Tool Installation Verification ===" && \
        echo "Checkstyle:" && checkstyle --version && \
        echo "Semgrep:" && semgrep --version && \
        echo "PMD:" && pmd --version | head -10 && \
        echo "SpotBugs:" && spotbugs -version && \
        echo "Checkstyle config size:" && wc -c /google_checks.xml && \
        echo "=== All tools installed successfully ==="

    WORKDIR /workspace
    CMD ["/bin/bash"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-java-v5-1
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=/workspace/Dockerfile"
        - "--context=/workspace"
        - "--destination=registry.digitalocean.com/codequal-registry/analyzer:lang-java-v5.1"
        - "--cache=true"
        - "--insecure"
        - "--skip-tls-verify"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: kaniko-secret
          mountPath: /kaniko/.docker
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: dockerfile
        configMap:
          name: dockerfile-java-v5-1
      - name: kaniko-secret
        secret:
          secretName: kaniko-secret
          items:
          - key: .dockerconfigjson
            path: config.json