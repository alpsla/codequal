apiVersion: v1
kind: ConfigMap
metadata:
  name: dockerfile-java-v5-1
  namespace: codequal-dev
data:
  Dockerfile: |
    FROM openjdk:11-jdk-slim

    RUN apt-get update && apt-get install -y \
        curl wget git python3 python3-pip unzip \
        && rm -rf /var/lib/apt/lists/*

    WORKDIR /tools

    # SpotBugs - Working
    RUN wget -q https://github.com/spotbugs/spotbugs/releases/download/4.8.0/spotbugs-4.8.0.zip && \
        unzip -q spotbugs-4.8.0.zip && \
        mv spotbugs-4.8.0 /opt/spotbugs && \
        rm spotbugs-4.8.0.zip && \
        ln -s /opt/spotbugs/bin/spotbugs /usr/local/bin/spotbugs

    # PMD - Working
    RUN wget -q https://github.com/pmd/pmd/releases/download/pmd_releases%2F7.0.0/pmd-dist-7.0.0-bin.zip && \
        unzip -q pmd-dist-7.0.0-bin.zip && \
        mv pmd-bin-7.0.0 /opt/pmd && \
        rm pmd-dist-7.0.0-bin.zip && \
        ln -s /opt/pmd/bin/pmd /usr/local/bin/pmd

    # Checkstyle - Fix the configuration
    RUN wget -q https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.5/checkstyle-10.12.5-all.jar && \
        mv checkstyle-10.12.5-all.jar /opt/checkstyle.jar && \
        echo '#!/bin/bash' > /usr/local/bin/checkstyle && \
        echo 'java -jar /opt/checkstyle.jar "$@"' >> /usr/local/bin/checkstyle && \
        chmod +x /usr/local/bin/checkstyle

    # Download proper Google checks XML
    RUN wget -q -O /google_checks.xml \
        https://raw.githubusercontent.com/checkstyle/checkstyle/checkstyle-10.12.5/src/main/resources/google_checks.xml && \
        echo "Google checks size: $(wc -c < /google_checks.xml) bytes"

    # Also download Sun checks as backup
    RUN wget -q -O /sun_checks.xml \
        https://raw.githubusercontent.com/checkstyle/checkstyle/checkstyle-10.12.5/src/main/resources/sun_checks.xml

    # Semgrep - Working, just needs proper invocation
    RUN pip3 install --no-cache-dir semgrep==1.45.0

    ENV SPOTBUGS_HOME=/opt/spotbugs
    ENV PMD_HOME=/opt/pmd
    ENV PATH=$PATH:/opt/spotbugs/bin:/opt/pmd/bin

    # Verification script
    RUN echo '#!/bin/bash' > /verify-tools.sh && \
        echo 'echo "=== Tool Verification ==="' >> /verify-tools.sh && \
        echo 'spotbugs -version 2>&1 | head -1' >> /verify-tools.sh && \
        echo 'pmd --version 2>&1 | head -1' >> /verify-tools.sh && \
        echo 'java -jar /opt/checkstyle.jar --version 2>&1' >> /verify-tools.sh && \
        echo 'semgrep --version 2>&1' >> /verify-tools.sh && \
        echo 'echo "Google checks size: $(wc -c < /google_checks.xml) bytes"' >> /verify-tools.sh && \
        echo 'echo "Sun checks size: $(wc -c < /sun_checks.xml) bytes"' >> /verify-tools.sh && \
        chmod +x /verify-tools.sh

    WORKDIR /workspace

    # Verify during build
    RUN /verify-tools.sh

    CMD ["/bin/bash"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kaniko-build-java-v5-1
  namespace: codequal-dev
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:latest
        args:
        - "--dockerfile=/workspace/Dockerfile"
        - "--context=/workspace"
        - "--destination=registry.digitalocean.com/codequal-registry/analyzer:lang-java-v5.1"
        - "--cache=true"
        - "--insecure"
        - "--skip-tls-verify"
        volumeMounts:
        - name: dockerfile
          mountPath: /workspace
        - name: kaniko-secret
          mountPath: /kaniko/.docker
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: dockerfile
        configMap:
          name: dockerfile-java-v5-1
      - name: kaniko-secret
        secret:
          secretName: kaniko-secret
          items:
          - key: .dockerconfigjson
            path: config.json