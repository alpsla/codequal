# FORBIDDEN PATTERNS - WILL TRIGGER VALIDATION ERRORS
forbidden_patterns:
  file_names:
    - "*-analyzer-v[0-8].ts"
    - "*-framework-v[0-8].ts"
    - "analyzer-*.ts" # outside of two-branch/analyzers
    - "framework-*.ts" # outside of two-branch/analyzers
    - "v10-*.ts" # prevent version creep
    - "new-analyzer*.ts"
    - "improved-*.ts"
    - "enhanced-analyzer*.ts"
    - "better-*.ts"
  
  directory_names:
    - "analyzers" # outside of two-branch
    - "new-analyzers"
    - "improved-analyzers"
    - "v10"
    - "alternative-*"
    - "backup-*"
  
  code_patterns:
    - "hardcoded_models = [" # Must fetch from Supabase
    - "const models = ['claude" # No hardcoded Claude models
    - "const models = ['gpt" # No hardcoded GPT models
    - "fileCount < 1000" # Must follow SMART_FILE_SELECTION_GUIDE.md
    - "fileCount > 500 &&" # Hardcoded thresholds forbidden

# NAMING CONVENTIONS - ENFORCED
naming_conventions:
  analyzers:
    pattern: "v9-{language}-analyzer.ts"
    location: "src/two-branch/analyzers/"
    example: "v9-java-analyzer.ts"
  
  framework_files:
    pattern: "v9-{component}.ts"
    location: "src/two-branch/analyzers/"
    example: "v9-analyzer-framework.ts"
  
  test_files:
    pattern: "test-v9-{description}.ts"
    location: "packages/agents/"
    example: "test-v9-kafka-fixed.ts"
  
  utility_files:
    pattern: "{description}-{version}.ts"
    location: "src/two-branch/utils/"
    example: "repository-utils-factory.ts"

# VALIDATION RULES
validation:
  pre_session_checks:
    - framework_registry_exists
    - component_manifest_valid
    - no_duplicate_analyzers
    - no_deprecated_usage
    - naming_conventions_followed
  
  file_creation_guards:
    - check_forbidden_patterns
    - validate_naming_convention
    - prevent_duplicate_components
    - enforce_location_rules
  
  git_hook_checks:
    - scan_for_duplicates
    - validate_against_manifest
    - check_deprecated_imports
    - enforce_version_consistency

# EMERGENCY OVERRIDE
# Only use in extreme circumstances with proper documentation
emergency_override:
  enabled: false
  requires_approval: true
  documentation_required: true
  rollback_plan_required: true

