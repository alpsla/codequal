# Dependency-Check Database Updater - Kubernetes CronJob
#
# Runs daily at 2 AM to update CVE database
# Includes validation, rollback, and monitoring integration
#
# Deploy:
#   kubectl apply -f k8s/dependency-check-updater-cronjob.yaml

apiVersion: batch/v1
kind: CronJob
metadata:
  name: dependency-check-updater
  namespace: codequal-dev
  labels:
    app: dependency-check-updater
    component: security
    managed-by: codequal
spec:
  # Run daily at 2 AM UTC
  schedule: "0 2 * * *"

  # Don't allow overlapping runs
  concurrencyPolicy: Forbid

  # Keep history
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  # Timeout after 1 hour
  startingDeadlineSeconds: 3600

  jobTemplate:
    metadata:
      labels:
        app: dependency-check-updater
    spec:
      # Retry failed runs once
      backoffLimit: 1

      # Timeout individual run after 45 minutes
      activeDeadlineSeconds: 2700

      template:
        metadata:
          labels:
            app: dependency-check-updater
        spec:
          restartPolicy: OnFailure

          # Use Oracle Cloud Node Selector (if needed)
          nodeSelector:
            kubernetes.io/arch: arm64  # Oracle A1.Flex

          containers:
          - name: updater
            image: node:18-alpine

            command:
            - /bin/sh
            - -c
            - |
              # Install dependencies
              npm install -g ts-node typescript

              # Run updater
              cd /app
              ts-node /app/src/two-branch/tools/java/dependency-check-updater.ts

            env:
            # NVD API Key (from secret)
            - name: NVD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dependency-check-secrets
                  key: nvd-api-key

            # Monitoring configuration
            - name: ENABLE_MONITORING
              value: "true"

            - name: METRICS_DIR
              value: "/data/dependency-check/logs"

            # Oracle Container Registry credentials
            - name: DOCKER_CONFIG
              value: "/docker-config"

            volumeMounts:
            # CVE database persistent storage
            - name: dependency-check-db
              mountPath: /data/dependency-check

            # Application code
            - name: app-code
              mountPath: /app
              readOnly: true

            # Docker config for Oracle registry
            - name: docker-config
              mountPath: /docker-config
              readOnly: true

            resources:
              requests:
                memory: "2Gi"
                cpu: "1000m"
              limits:
                memory: "4Gi"
                cpu: "2000m"

          volumes:
          # Persistent volume for CVE database
          - name: dependency-check-db
            persistentVolumeClaim:
              claimName: dependency-check-cache

          # Application code from ConfigMap or Git
          - name: app-code
            hostPath:
              path: /opt/codequal/packages/agents
              type: Directory

          # Docker credentials for Oracle Container Registry
          - name: docker-config
            secret:
              secretName: oracle-registry-credentials

---
# Persistent Volume Claim for CVE Database
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dependency-check-cache
  namespace: codequal-dev
spec:
  accessModes:
    - ReadWriteMany  # Multiple pods can read simultaneously
  storageClassName: oci-bv  # Oracle Block Volume
  resources:
    requests:
      storage: 10Gi  # 3GB DB + 2GB indexes + headroom

---
# Secret for NVD API Key (create manually)
# kubectl create secret generic dependency-check-secrets \
#   --from-literal=nvd-api-key=YOUR-API-KEY-HERE \
#   -n codequal-dev

apiVersion: v1
kind: Secret
metadata:
  name: dependency-check-secrets
  namespace: codequal-dev
type: Opaque
data:
  # Base64 encoded NVD API key
  # Replace with: echo -n 'your-api-key' | base64
  nvd-api-key: eHh4eHh4eHgteHh4eC14eHh4LXh4eHgteHh4eHh4eHh4eHh4  # REPLACE THIS

---
# Secret for Oracle Container Registry
# kubectl create secret docker-registry oracle-registry-credentials \
#   --docker-server=iad.ocir.io \
#   --docker-username=TENANCY/USERNAME \
#   --docker-password=AUTH-TOKEN \
#   -n codequal-dev

apiVersion: v1
kind: Secret
metadata:
  name: oracle-registry-credentials
  namespace: codequal-dev
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: eyJhdXRocyI6eyJpYWQub2Npci5pbyI6eyJ1c2VybmFtZSI6IlRFTkFOQ1kvVVNFUk5BTUUiLCJwYXNzd29yZCI6IkFVVEgtVE9LRU4ifX19  # REPLACE THIS

---
# ServiceMonitor for Prometheus/Grafana (optional)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dependency-check-updater
  namespace: codequal-dev
spec:
  selector:
    matchLabels:
      app: dependency-check-updater
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
